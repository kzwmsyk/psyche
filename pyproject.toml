[project]
name = "psyche"
version = "0.1.0"
description = "A Scheme interpreter in Python"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "unimplemented: tests for features not yet implemented",
]
